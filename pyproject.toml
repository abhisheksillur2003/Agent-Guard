[project]
name = "agentguard"
version = "0.11.0"
description = "Security, reliability, and observability control plane for AI agents"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "celery[redis]>=5.5,<6",
    "email-validator>=2.2,<3",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "jsonschema>=4.25,<5",
    "opentelemetry-api>=1.37,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.37,<2",
    "opentelemetry-sdk>=1.37,<2",
    "prometheus-client>=0.22,<1",
    "pwdlib[argon2]>=0.3,<1",
    "pydantic-settings>=2.10,<3",
    "pyjwt[crypto]>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
agentguard-admin = "backend.app.cli.__main__:main"

[dependency-groups]
dev = [
    "pyright>=1.1.400,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.uv]
required-version = ">=0.12.0"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["tmp"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]

[tool.pyright]
include = ["backend"]
exclude = ["backend/alembic/versions"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
