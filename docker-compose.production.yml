name: agentguard-production

x-backend: &backend
  image: ${AGENTGUARD_API_IMAGE:-agentguard-api:0.11.0}
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file:
    - ${AGENTGUARD_ENV_FILE:-.env.production}
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - production_postgres_data:/var/lib/postgresql/data
    networks:
      - data
    restart: unless-stopped

  redis:
    image: redis:8-alpine@sha256:ba6e394f6acc2a695ef1b6944f161b9ca813711739be68319fa0db3470673f1d
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - exec redis-server --save '' --appendonly no --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - app
    restart: unless-stopped

  migrate:
    <<: *backend
    profiles: ["tools"]
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command:
      - uvicorn
      - backend.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - ${WEB_CONCURRENCY:-2}
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/readyz', headers={'Host':'api'}); urllib.request.urlopen(request, timeout=3)
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app
      - data
      - edge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    <<: *backend
    command:
      - celery
      - -A
      - backend.app.worker:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=${CELERY_CONCURRENCY:-2}
    healthcheck:
      disable: true
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s

  scheduler:
    <<: *backend
    command:
      - celery
      - -A
      - backend.app.worker:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
    healthcheck:
      disable: true
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${AGENTGUARD_FRONTEND_IMAGE:-agentguard-frontend:0.11.0}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      AGENTGUARD_API_URL: http://api:8000
      NODE_ENV: production
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - production_caddy_data:/data
      - production_caddy_config:/config
    networks:
      - edge
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped

networks:
  edge:
  app:
    internal: true
  data:
    internal: true

volumes:
  production_postgres_data:
  production_caddy_data:
  production_caddy_config:
